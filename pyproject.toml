[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so bare `pytest` (as CI runs it) can import `app`.
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
